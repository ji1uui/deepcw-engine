# Windows・macOS・Linux で組み立て、数値と ABI を確かめます（要件 NFR-3.1）。
#
# **この木の対象は Windows と macOS です。**Linux は開発に使っている容器で
# あって、配る先ではありません。それなのに、版 2.62 まで**対象 OS では一度も
# 組み立てたことも走らせたこともありませんでした**（付録 F.1、AB.5）。
#
# `.claude/skills/lazarus-cross-platform` はこう定めています——
# 「cross-platform verified を名乗るには対象 matrix の実行結果が必要。
# 実行不能な platform は NOT VERIFIED とする」。その実行結果をここで取ります。
#
# **最初は狭く始めます。**外部ライブラリの要らないものだけ——組み立てと、
# 数値の検証と、構造体の並びの検証。ここが緑になってから、ONNX Runtime と
# 画面の検証へ広げます。**緑にならない段を最初から積むと、どれが本当の問題か
# 分からなくなります。**
#
# Builds and checks on Windows, macOS and Linux (requirement NFR-3.1).
#
# **The targets of this tree are Windows and macOS.** Linux is the container it
# is developed in, not a platform it ships to -- and yet, up to version 2.62,
# **it had never once been built or run on either target** (appendices F.1,
# AB.5). The project's own standard says that claiming cross-platform verified
# needs results from the target matrix; this is where they come from.
#
# **It starts narrow**: only what needs no external library -- the build, the
# numeric checks, and the structure-layout check. Once that is green it widens
# to ONNX Runtime and the screen checks. **Stacking steps that are not green
# yet makes it impossible to tell which failure is the real one.**

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # 3 つの OS で同じ書き方をするためです。Windows の runner にも bash が
    # あります。**OS ごとに別の script を書くと、片方だけ古くなります**
    # （教訓 10.11）。
    # One spelling for all three: the Windows runner has bash too. **Separate
    # scripts per OS is how one of them goes stale** (lesson 10.11).
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # 初回、macOS の入れる段が **41 分**かかって落ちました（SourceForge から
    # の取得）。**止まったまま待つのは、落ちるより悪い**——落ちたことすら
    # 分からないからです。
    # On the first run the macOS install step took **41 minutes** before failing
    # (fetching from SourceForge). **Hanging is worse than failing**: a failure
    # at least says so.
    timeout-minutes: 45
    strategy:
      # 1 つ落ちても残りを止めません。**どの OS で落ちたかを知りたいのであって、
      # 最初に落ちた 1 つを知りたいのではありません。**
      # One failure does not stop the others: **which platforms fail is the
      # question, not which fails first.**
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
          - os: windows-latest
            name: Windows x86_64
          - os: macos-latest
            name: macOS ARM64
          # macOS x86_64（`macos-13`）は外しました。**初回、50 分待っても
          # 順番が来ませんでした。**順番待ちのまま終わらない段があると、
          # **run 全体がいつまでも結論を出しません。**Intel の macOS は
          # 走らせる手立てが決まってから戻します（NOT VERIFIED のまま）。
          # macOS x86_64 (`macos-13`) is left out: **on the first run it never
          # got a runner in 50 minutes**, and a job that stays queued means
          # **the run never reaches a verdict.** Intel macOS comes back when
          # there is a way to run it; until then it stays NOT VERIFIED.

    steps:
      - uses: actions/checkout@v4

      - name: Lazarus を入れる（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lazarus
          lazbuild --version

      - name: Lazarus を入れる（Windows）
        if: runner.os == 'Windows'
        run: |
          choco install lazarus -y --no-progress
          # choco は PATH をこの step に反映しないので、場所を渡します。
          # choco does not put it on this step's PATH, so the place is passed on.
          echo "C:/lazarus" >> "$GITHUB_PATH"

      # **`brew install --cask lazarus` は使えません。**初回の実行で分かりました。
      #
      #   fpc-laz: Cask 'fpc-laz' has been disabled because it does not pass
      #   the macOS Gatekeeper check! It was disabled on 2026-09-01.
      #
      # `lazarus` の cask 自体も 2026-01-27 に deprecated になっており、取得に
      # 41 分かかったうえで依存の 2 つが落ちました。
      #
      # 代わりに、**コンパイラは formula から入れ、`lazbuild` は原典から組み
      # ます。**SourceForge も Gatekeeper も通りません。
      #
      # 版は**問い合わせて決めます。**ここに書き写すと、Lazarus が版を上げた
      # 日に、書き写した綴りだけが古くなります（教訓 10.11）。
      #
      # **`brew install --cask lazarus` does not work**, as the first run showed:
      # its two dependencies are disabled for failing the macOS Gatekeeper
      # check, and the cask itself was deprecated on 2026-01-27 -- after a
      # 41-minute fetch.
      #
      # Instead **the compiler comes from the formula and `lazbuild` is built
      # from source**, touching neither SourceForge nor Gatekeeper.
      #
      # The version is **asked for, not written down here**: written down, it
      # is the spelling that goes stale the day Lazarus moves (lesson 10.11).
      - name: Lazarus を入れる（macOS）
        if: runner.os == 'macOS'
        run: |
          set -e
          brew install fpc
          fpc -iV
          tag=$(git ls-remote --tags --refs \
                  https://gitlab.com/freepascal.org/lazarus/lazarus.git \
                | awk -F/ '{print $NF}' \
                | grep -E '^lazarus_[0-9]+_[0-9]+$' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "Lazarus の版が問い合わせられません"; exit 1; }
          echo "Lazarus $tag を組みます"
          git clone --depth 1 --branch "$tag" \
            https://gitlab.com/freepascal.org/lazarus/lazarus.git "$HOME/lazarus"
          make -C "$HOME/lazarus" lazbuild
          # 原典から組んだ `lazbuild` は、**自分がどこの Lazarus なのかを
          # 知りません。**設定ファイル（`environmentoptions.xml`）が無いので
          # `Invalid Lazarus directory "": directory lcl not found` で止まり
          # ます（2 回目の実行で分かりました）。
          #
          # 毎回 `--lazarusdir` を書き足す手もありますが、**`lazbuild` を呼ぶ
          # のはこの workflow だけではありません**——`tools/make_bundle.sh` も
          # 呼びます。呼ぶ側を 2 か所直すより、**PATH に置く `lazbuild` の
          # ほうを整える**ほうが確かです（教訓 10.11）。
          #
          # A `lazbuild` built from source **does not know which Lazarus it
          # belongs to**: with no `environmentoptions.xml` it stops with
          # `Invalid Lazarus directory "": directory lcl not found` (which the
          # second run showed).
          #
          # `--lazarusdir` could be added at each call site, but **this workflow
          # is not the only caller** -- `tools/make_bundle.sh` calls it too.
          # Fixing the `lazbuild` that is on PATH is surer than fixing two
          # callers (lesson 10.11).
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec "%s/lazarus/lazbuild" --lazarusdir="%s/lazarus" "$@"\n' \
            "$HOME" "$HOME" > "$HOME/bin/lazbuild"
          chmod +x "$HOME/bin/lazbuild"
          cat "$HOME/bin/lazbuild"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: 版を言う
        run: |
          lazbuild --version
          fpc -iV || true

      # **道具の身元。**macOS の 3 回目の実行で、LCL（cocoa）のリンクが
      # 落ちました。
      #
      #   ld: malformed method list atom 'ltmp5'
      #       (.../cocoa/cocoawsextctrls.o),
      #       fixups found beyond the number of method entries
      #
      # FPC が出す Objective-C の並びを、Apple の新しいリンカが受け付けて
      # いません。**直し方は、どのリンカと Xcode が居るかで変わります。**
      # 推測で当てにいく前に、居るものを言わせます。
      #
      # **Who the tools are.** On the third run the LCL (cocoa) link failed:
      # Apple's newer linker rejects the Objective-C method lists FPC emits.
      # **Which fix applies depends on which linker and Xcode are present**, so
      # before guessing at one, the machine is asked what it has.
      - name: 道具の身元を言う（macOS）
        if: runner.os == 'macOS'
        run: |
          fpc -iV
          fpc -iTO -iTP || true
          xcode-select -p
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "Xcode の別版は無し"
          ld -v 2>&1 | head -5 || true
          find /opt/homebrew -name 'fpc.cfg' 2>/dev/null | head -5
          # **古いリンカが残っているか。**`-ld_classic` は Xcode 15 で
          # 非推奨になり、16 で外されたと言われています。**言われている
          # ことではなく、この機械にあるかどうかを見ます。**
          # **Is the classic linker still here?** `-ld_classic` was deprecated
          # in Xcode 15 and is said to be gone in 16. **What is looked at is
          # this machine, not what is said.**
          if ld -ld_classic -v >/dev/null 2>&1; then
            echo "ld_classic: あり"
          else
            echo "ld_classic: 無し"
          fi

      # FPC 3.2.2 が出す Objective-C の並びを、Apple の新しいリンカ
      # （ld-1267）が受け付けません。**古いリンカが残っていれば、それで
      # 通ります。**残っていなければ、何もしません——**通らないものを
      # 通ったように見せないためです。**
      #
      # Apple's newer linker (ld-1267) rejects the Objective-C method lists FPC
      # 3.2.2 emits. **Where the classic linker survives, it is used**; where it
      # does not, nothing is done -- **what does not work is not made to look as
      # though it did.**
      - name: 古いリンカがあれば使う（macOS）
        if: runner.os == 'macOS'
        run: |
          cfg=/opt/homebrew/etc/fpc.cfg
          if ld -ld_classic -v >/dev/null 2>&1 && [ -f "$cfg" ]; then
            echo "-k-ld_classic" >> "$cfg"
            echo "古いリンカを使うように $cfg へ書き足しました"
          else
            echo "古いリンカは使えません。画面のアプリのリンクは落ちる見込みです"
          fi

      # **組み立てを 2 つに分けます。**命令行の道具は LCL を使いません。
      # 画面のアプリだけが落ちるのなら、**落ちているのは LCL の cocoa であって
      # この木のコードではない**と言えます。分けておけば、画面が組めない間も
      # 数値と ABI の検証は macOS で走ります。
      #
      # **順番が大事です。**画面を最後に置くのは、落ちたときに前の段の結果を
      # 失わないためです。**段が落ちれば job は落ちます**——隠してはいません。
      #
      # **The build is split in two.** The command-line tools do not use the
      # LCL: if only the GUI fails, **what is failing is the LCL's cocoa
      # widgetset and not this tree's code.** Split, the numeric and ABI checks
      # still run on macOS while the GUI cannot be linked.
      #
      # **The order matters**: the GUI goes last so that a failure there does
      # not cost the results of the steps before it. **A failing step still
      # fails the job** -- nothing is hidden.
      - name: 命令行の道具を組み立てる
        working-directory: lazarus
        run: |
          set -e
          for p in cli/cw_devices cli/cw_loopback cli/cw_stream cli/cw_tune \
                   cli/decode_morse cli/dsp_check cli/rig_check cli/perf_report; do
            echo "== $p =="
            lazbuild -B "$p.lpi"
          done
          # `rig_check` は Hamlib の `rigctld` が要るので、ここでは組むだけです
          # （Hamlib を動的に結ぶ単位が、どの OS でも組めることを確かめる）。
          # `rig_check` needs Hamlib's `rigctld`, so here it is only built
          # (proving the dynamically bound Hamlib unit compiles on every OS).

      # 外部ライブラリを要りません。**数百件の数値がここで確かめられます。**
      #
      # Windows では実行ファイルに `.exe` が付きます。**bash が補ってくれる
      # かどうかに頼りません。**補わなければ「見つかりません」で落ち、しかも
      # それは Windows でしか起きません。
      #
      # Needs no external library: **hundreds of numeric checks land here.**
      #
      # On Windows the executables carry `.exe`. **Whether bash supplies it is
      # not relied on**: if it does not, the step fails with "not found", and
      # only on Windows.
      #
      # `DEEPCW_HTTPS_PROBE_URLS`: 各 OS の HTTPS の部品が、実際の応答を
      # 受け取れること（付録 CM.16）。**総務省の照会先ではありません**（試験の
      # たびに負荷を掛けないため）。小さい本文と、上限（64 KB）を越える本文の 2 つ。
      #
      # `DEEPCW_HTTPS_PROBE_URLS`: each system's HTTPS client receives a real
      # answer (appendix CM.16). **Not the ministry's lookup service** (no load
      # on it per test run). One small body and one over the 64 KB limit.
      - name: 数値・記録・読み取りの検証
        working-directory: lazarus
        env:
          DEEPCW_HTTPS_PROBE_URLS: https://github.com/robots.txt https://github.com/
        run: ./cli/dsp_check${{ runner.os == 'Windows' && '.exe' || '' }}

      # 性能の報告（計画 6.1 の P2）が、この OS で表を出せること。**基準機で
      # 走らせてもらうのはこの道具**なので、Windows で動かないと分かるのが
      # 利用者の手元では遅すぎます。CI には ONNX Runtime が無く、画面のアプリも
      # まだ組んでいないので、数の行は「測れない」になります。確かめるのは、
      # 道具を呼んで表を組めること、機械の名前と論理コアの数が OS から読める
      # こと（`CpuDescription`・`LogicalProcessorCount`）です。
      #
      # The performance report (plan 6.1, P2) produces its table on this system.
      # **This is the tool the baseline machine is asked to run**, so learning
      # that it fails on Windows at the operator's desk would be too late. The CI
      # has no ONNX Runtime and the GUI is not built yet, so the figures read
      # "cannot measure"; what is checked is that the tools are called and the
      # table assembled, and that the machine's name and logical processor count
      # come from the system.
      - name: 性能の報告が表を出す（数はエンジン無しで「測れない」）
        working-directory: lazarus
        run: |
          set -e
          ./cli/perf_report${{ runner.os == 'Windows' && '.exe' || '' }} | tee perf.md
          grep -q '^| 要件 | 目標 | 測った値 | 判定 | 測り方 |' perf.md
          grep -q 'NFR-1.7' perf.md
          grep -Eq '論理コア [1-9]' perf.md

      # **移植先で最初に走らせるもの。**PortAudio の構造体の並びは OS と
      # 処理系で変わりえます。ここが崩れていれば、装置一覧の中身は何一つ
      # 信用できません。
      # **The first thing to run on a new platform.** PortAudio's structure
      # layout can differ by system and compiler, and if it is wrong nothing in
      # the device list can be trusted.
      - name: PortAudio の構造体の並び
        working-directory: lazarus
        run: ./cli/cw_devices${{ runner.os == 'Windows' && '.exe' || '' }} --abi-only

      # macOS では、**分かっている 1 つの失敗（未解決 #25）だけ**を通します。
      # FPC 3.2.2 と新しい Apple のリンカの食い違いで、3.2.4 を待つと決めて
      # います（付録 BK.4）。**ずっと赤い CI は新しい失敗を知らせられない**ので、
      # 印を見分けて警告に変え、ほかの失敗（コンパイルの誤りを含む）はすべて
      # 落とします（`tools/known_link_failure.sh`、付録 BO）。リンクできた
      # ときだけ、次の段で `.app` を組みます。
      #
      # On macOS **only the one known failure (open question #25)** is let
      # through: FPC 3.2.2 against Apple's newer linker, waiting for 3.2.4 by
      # decision (appendix BK.4). **A CI that is always red cannot announce a
      # new failure**, so the signature is recognised and turned into a warning,
      # and every other failure -- a compile error included -- still fails
      # (`tools/known_link_failure.sh`, appendix BO). The `.app` step runs only
      # when linking succeeded.
      - name: 画面のアプリを組み立てる
        id: gui
        working-directory: lazarus
        shell: bash
        run: |
          set -e
          linked=true
          for p in app/deepcw_station app/gui_probe; do
            echo "== $p =="
            if [ "$RUNNER_OS" != "macOS" ]; then
              lazbuild -B "$p.lpi"
              continue
            fi
            log="$RUNNER_TEMP/$(basename "$p").log"
            if lazbuild -B "$p.lpi" >"$log" 2>&1; then
              tail -5 "$log"
              continue
            fi
            tail -40 "$log"
            if ./tools/known_link_failure.sh "$log" "$(fpc -iV)"; then
              echo "::warning title=#25 macOS link::$p はリンクできません（FPC 3.2.2 と新しいリンカ。3.2.4 待ち）。コンパイルは通っています"
              linked=false
            else
              exit 1
            fi
          done
          echo "linked=$linked" >>"$GITHUB_OUTPUT"

      # macOS だけ。**`.app` を組み、署名が通るかを確かめます。**版 2.62 で
      # 並びは Linux で確かめましたが、`codesign` は macOS でしか走りません
      # （付録 BJ.6 の NOT VERIFIED の 1 行）。
      #
      # `-s -` は ad-hoc の署名です。配布には証明書が要りますが、**入れ物の形が
      # 署名を通るかどうか**はこれで分かります。
      #
      # macOS only. **The `.app` is assembled and put through signing.** Version
      # 2.62 checked the arrangement on Linux, but `codesign` runs only on macOS
      # (one of the NOT VERIFIED rows of appendix BJ.6).
      #
      # `-s -` signs ad-hoc: distribution needs a certificate, but **whether the
      # bundle's shape passes signing at all** is answered here.
      - name: .app を組んで署名を通す（macOS）
        if: runner.os == 'macOS' && steps.gui.outputs.linked == 'true'
        working-directory: lazarus
        run: |
          set -e
          DEEPCW_ALLOW_MISSING_LICENCE=1 ./tools/make_bundle.sh "$PWD/dist"
          app=$(find dist -maxdepth 2 -type d -name '*.app' | head -1)
          [ -n "$app" ] || { echo ".app が出来ていません"; exit 1; }
          echo "== plutil =="
          plutil -lint "$app/Contents/Info.plist"
          echo "== codesign =="
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "== 許可の宣言が署名後も残っているか =="
          # **署名は入れ物を封じます。**封じたあとで読めなければ、配った先でも
          # 読めません。
          # **Signing seals the bundle**; unreadable afterwards means unreadable
          # wherever it goes.
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' \
            "$app/Contents/Info.plist"


      # Windows の配布物（付録 CO）。**展開して起動するだけで受信できる形**を
      # 組み、成果物として残します（要件 FR-A.1）。
      #
      # - ONNX Runtime は Microsoft の配布物（GitHub の release）をそのまま使い
      #   ます。版は Linux で試験している版と同じにそろえます
      # - PortAudio は Windows 用の配布物が公式に無いので、vcpkg で原典から組み
      #   ます。条項は vcpkg が置く `copyright` を使います
      # - **組んだあと、配布物の中の道具だけで読めるかを確かめます。**環境変数で
      #   ライブラリを指さず、配布物の外のフォルダから呼びます。置き場所を誤れば
      #   ここで落ちます
      # - 成果物はフォルダのまま残します（下の段）
      #
      # 署名はしていません（証明書がありません）。初めて開くとき SmartScreen が
      # 止めることがあります（はじめに.txt に書いた）。
      #
      # The Windows package (appendix CO): **unpack and start, and it receives**
      # (requirement FR-A.1), kept as an artifact. ONNX Runtime is Microsoft's own
      # release, at the same version the Linux tests run; PortAudio has no
      # official Windows binary, so vcpkg builds it from source and its
      # `copyright` is the licence text. **Afterwards the tools inside the
      # package must read a test tone with nothing but what is bundled** -- no
      # library is pointed at by environment, and they are called from outside
      # the package, so a misplaced file fails here. Unsigned (no certificate):
      # SmartScreen may stop the first start (said in はじめに.txt).
      - name: Windows の配布物を組んで、中の道具で読めるか確かめる
        if: runner.os == 'Windows'
        working-directory: lazarus
        env:
          ORT_VERSION: 1.30.0
        run: |
          set -eo pipefail
          # 作業場所は bash の綴りに直します（`D:\a\_temp` のままでは扱いにくい）。
          # The work place in bash's spelling (`D:\a\_temp` is awkward as is).
          tmp=$(cygpath -u "$RUNNER_TEMP")
          deps="$tmp/deps"
          mkdir -p "$deps"
          echo "== ONNX Runtime $ORT_VERSION =="
          curl -fsSL -o "$deps/ort.zip" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          unzip -q "$deps/ort.zip" -d "$deps"
          ort="$deps/onnxruntime-win-x64-$ORT_VERSION"
          ls "$ort" "$ort/lib"
          echo "== PortAudio（vcpkg） =="
          vcpkg_root=$(cygpath -u "$VCPKG_INSTALLATION_ROOT")
          "$vcpkg_root/vcpkg.exe" install portaudio:x64-windows
          pa="$vcpkg_root/installed/x64-windows"
          ls "$pa/bin"
          pa_dll=$(ls "$pa/bin"/portaudio*.dll | head -1)
          [ -n "$pa_dll" ] || { echo "PortAudio の DLL がありません"; exit 1; }
          echo "== 組み立て =="
          DEEPCW_ONNXRUNTIME="$ort/lib/onnxruntime.dll" \
          DEEPCW_PORTAUDIO="$pa_dll" \
          DEEPCW_PORTAUDIO_LICENCE="$pa/share/portaudio/copyright" \
            ./tools/make_bundle.sh "$PWD/dist"
          stage="$PWD/dist/deepcw-station-windows-x86_64"
          [ -f "$stage/deepcw_station.exe" ] || { echo "deepcw_station.exe がありません"; exit 1; }
          echo "== 配布物の中の道具で読む =="
          # Windows の道具には Windows の綴りで渡します。
          # Windows tools are given Windows spellings.
          wav=$(cygpath -w "$tmp/test.wav")
          python tools/make_test_wav.py "$wav"
          cd "$tmp"
          env -u DEEPCW_ONNXRUNTIME -u DEEPCW_PORTAUDIO \
            "$stage/cw_devices.exe" | tee devices.txt
          grep -q "PortAudio V" devices.txt
          env -u DEEPCW_ONNXRUNTIME -u DEEPCW_PORTAUDIO \
            "$stage/decode_morse.exe" --wav "$wav" | tee decoded.txt
          grep -q "CQ CQ DE JA1ABC JA1ABC K" decoded.txt

      # **フォルダのまま渡します**（GitHub が 1 つの zip にして配ります）。
      # 版 3.00 の初めは zip を作って渡したので、落とすと zip の中に zip が
      # あり、利用者の Windows の展開で「パスワードで保護されています」と出た
      # （付録 CO.5）。2 重をやめ、展開は 1 回で済むようにします。
      # `dist/` を渡すので、zip の中は `deepcw-station-windows-x86_64/` の
      # フォルダ 1 つです。
      # **Handed over as a folder** (GitHub serves it as one zip). Early in
      # 3.00 a zip was uploaded, so the download held a zip inside a zip, and
      # the operator's Windows extraction asked for a password (appendix CO.5).
      # No more nesting: one extraction. `dist/` is given, so the zip holds a
      # single `deepcw-station-windows-x86_64/` folder.
      - name: Windows の配布物を残す
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: deepcw-station-windows-x86_64
          path: lazarus/dist/
          if-no-files-found: error
          retention-days: 30

      # **地方時が OS（`date`）と一致するか**（未解決 #20、付録 BW.4）。FPC の
      # Unix の RTL は時差を自前で読み、`TZ=Asia/Tokyo` や「slim」形式の
      # 時間帯ファイルで UTC になります。`struct tm` の並びを読むので、**macOS
      # での結果はここでしか得られません。**Windows では確かめるものが無く、
      # すぐ終わります。
      # **Whether local time agrees with the OS (`date`)** (open question #20,
      # appendix BW.4). FPC's Unix RTL reads the offset itself and falls back to
      # UTC with `TZ=Asia/Tokyo` or a "slim" zone file. It reads the layout of
      # `struct tm`, so **this is the only place a macOS result comes from.** On
      # Windows there is nothing to check and it ends at once.
      - name: 地方時と OS の一致
        working-directory: lazarus
        run: ./tools/local_clock_test.sh

      # **命令行の道具が日本語を UTF-8 のまま出せるか**（未解決 #24、付録 BQ）。
      # Windows では `Format` で組んだ行だけが化けていました。どの段で化けるかを
      # バイト列で切り分けます。**最後に置きます**——報告が記録の末尾に来るので、
      # 通っても落ちても読めます。
      # **Whether the command-line tools write Japanese out as UTF-8** (open
      # question #24, appendix BQ). On Windows only the lines built with `Format`
      # came out garbled; this tells the stages apart by their bytes. **It comes
      # last**, so its report ends the log and can be read either way.
      - name: 日本語の出力（命令行）
        working-directory: lazarus
        run: ./tools/text_output_test.sh

  # macOS（Apple Silicon）の配布物（付録 CQ）。
  #
  # **FPC 3.2.2 では画面のアプリがリンクできません**（未解決 #25: Apple の
  # 新しいリンカ ld-1267 が、3.2.2 の出す Objective-C の並びを拒む）。CI の
  # Xcode はすべて 26.x で、古いリンカ（`-ld_classic`）も残っていません。
  # 直した FPC は `release_3_2_4_rc2` にあり、**3.2.4 の正式版はまだ出て
  # いません。**利用者の判断（付録 CQ.2）で、**この job だけ** 3.2.4-rc2 を
  # 原典から組んで使います。上の matrix（Linux・Windows・macOS の試験）は
  # 3.2.2 のままです。
  #
  # The macOS (Apple Silicon) package (appendix CQ). **FPC 3.2.2 cannot link
  # the GUI** (open question #25: Apple's ld-1267 rejects the Objective-C
  # method lists 3.2.2 emits); every Xcode on the runner is 26.x and the
  # classic linker is gone. The fix is in `release_3_2_4_rc2`, and **3.2.4 has
  # no final release yet.** By the operator's decision (appendix CQ.2) **this
  # job alone** builds 3.2.4-rc2 from source and uses it; the matrix above
  # stays on 3.2.2.
  macos-package:
    name: macOS ARM64 配布物
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      FPC_TAG: release_3_2_4_rc2
      ORT_VERSION: 1.30.0
    steps:
      - uses: actions/checkout@v4

      # 3.2.2（Homebrew）を足場に、3.2.4-rc2 を組みます。SDK の場所は
      # `xcrun` に尋ねます（書き写すと Xcode が上がった日に古くなる）。
      # 3.2.2 (Homebrew) bootstraps 3.2.4-rc2. The SDK location is asked of
      # `xcrun` rather than written down.
      - name: FPC 3.2.4-rc2 を原典から組む
        run: |
          set -eo pipefail
          brew install fpc portaudio
          sdk=$(xcrun --show-sdk-path)
          echo "SDK: $sdk"
          git clone --depth 1 --branch "$FPC_TAG" \
            https://gitlab.com/freepascal.org/fpc/source.git "$HOME/fpcsrc"
          cd "$HOME/fpcsrc"
          make all FPC="$(command -v fpc)" OPT="-XR$sdk" >"$RUNNER_TEMP/fpc-build.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/fpc-build.log"; exit 1; }
          tail -3 "$RUNNER_TEMP/fpc-build.log"
          make install INSTALL_PREFIX="$HOME/fpc" FPC="$PWD/compiler/ppca64" \
            >"$RUNNER_TEMP/fpc-install.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/fpc-install.log"; exit 1; }
          ver=$(ls "$HOME/fpc/lib/fpc" | grep -E '^3\.' | head -1)
          echo "版の置き場所: $HOME/fpc/lib/fpc/$ver"
          ln -sf "$HOME/fpc/lib/fpc/$ver/ppca64" "$HOME/fpc/bin/ppca64"
          mkdir -p "$HOME/fpc/etc"
          "$HOME/fpc/lib/fpc/$ver/samplecfg" "$HOME/fpc/lib/fpc/$ver" "$HOME/fpc/etc" >/dev/null
          # **Homebrew の 3.2.2 の設定を読ませません。**読めば 3.2.2 の部品と
          # 混ざります。設定の場所を指し、SDK も書き足します。
          # **3.2.2's Homebrew configuration must not be read**, or 3.2.2's
          # units would mix in: the configuration is pointed at, with the SDK.
          echo "-XR$sdk" >> "$HOME/fpc/etc/fpc.cfg"
          echo "PPC_CONFIG_PATH=$HOME/fpc/etc" >> "$GITHUB_ENV"
          echo "$HOME/fpc/bin" >> "$GITHUB_PATH"

      - name: Lazarus（lazbuild）を 3.2.4-rc2 で組む
        run: |
          set -eo pipefail
          which fpc
          fpc -iV
          fpc -i | head -3 || true
          tag=$(git ls-remote --tags --refs \
                  https://gitlab.com/freepascal.org/lazarus/lazarus.git \
                | awk -F/ '{print $NF}' \
                | grep -E '^lazarus_[0-9]+_[0-9]+$' | sort -V | tail -1)
          [ -n "$tag" ] || { echo "Lazarus の版が問い合わせられません"; exit 1; }
          echo "Lazarus $tag を組みます"
          git clone --depth 1 --branch "$tag" \
            https://gitlab.com/freepascal.org/lazarus/lazarus.git "$HOME/lazarus"
          make -C "$HOME/lazarus" lazbuild >"$RUNNER_TEMP/laz.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/laz.log"; exit 1; }
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\nexec "%s/lazarus/lazbuild" --lazarusdir="%s/lazarus" "$@"\n' \
            "$HOME" "$HOME" > "$HOME/bin/lazbuild"
          chmod +x "$HOME/bin/lazbuild"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # **#25 の印を許しません。**3.2.4-rc2 で組めないなら、配布物は作れて
      # いないのだから落とします。
      # **The #25 signature is not let through**: if 3.2.4-rc2 cannot link
      # it, no package was made, and the job fails.
      - name: 画面のアプリを組む（.app）と同梱物
        working-directory: lazarus
        run: |
          set -eo pipefail
          tmp="$RUNNER_TEMP"
          curl -fsSL -o "$tmp/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-osx-arm64-$ORT_VERSION.tgz"
          tar -xzf "$tmp/ort.tgz" -C "$tmp"
          ort="$tmp/onnxruntime-osx-arm64-$ORT_VERSION"
          ls "$ort" "$ort/lib"
          ort_lib=$(ls "$ort"/lib/libonnxruntime.*.dylib | grep -v '\.dSYM' | head -1)
          # Homebrew の名前は版つきの実体への別名です。**実体を渡します**——
          # 条項は実体のそばで探します。
          # Homebrew's name is an alias of the versioned file. **The real file
          # is passed**: the licence is looked for beside it.
          pa_lib=$(python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' \
            "$(brew --prefix portaudio)/lib/libportaudio.2.dylib")
          pa_licence=$(find "$(brew --prefix portaudio)/" -maxdepth 2 -iname 'LICENSE*' | head -1)
          echo "ONNX Runtime: $ort_lib"
          echo "PortAudio: $pa_lib（条項 $pa_licence）"
          version=$(grep -m1 "DEEPCW_VERSION = " src/deepcw.licenselookup.pas | sed "s/.*'\(.*\)'.*/\1/")
          DEEPCW_ONNXRUNTIME="$ort_lib" \
          DEEPCW_PORTAUDIO="$pa_lib" \
          DEEPCW_PORTAUDIO_LICENCE="$pa_licence" \
          DEEPCW_BUNDLE_VERSION="$version" \
            ./tools/make_bundle.sh "$PWD/dist"

      - name: 署名（ad-hoc）と、中の道具で読めるか
        working-directory: lazarus
        run: |
          set -eo pipefail
          stage="$PWD/dist/deepcw-station-macos-arm64"
          app="$stage/DeepCW Station.app"
          [ -x "$app/Contents/MacOS/deepcw_station" ] || { echo ".app に本体がありません"; exit 1; }
          # Apple Silicon では、**署名の無いものは動きません**（ad-hoc で足る）。
          # 証明書が無いので配布の署名・公証はしていません（付録 CQ.5）。
          # On Apple Silicon **unsigned code does not run** (ad-hoc is enough).
          # No certificate, so no distribution signing or notarisation.
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          file "$app/Contents/MacOS/deepcw_station"
          python3 tools/make_test_wav.py "$RUNNER_TEMP/test.wav"
          cd "$RUNNER_TEMP"
          env -u DEEPCW_ONNXRUNTIME -u DEEPCW_PORTAUDIO \
            "$app/Contents/MacOS/cw_devices" | tee devices.txt
          grep -q "PortAudio V" devices.txt
          env -u DEEPCW_ONNXRUNTIME -u DEEPCW_PORTAUDIO \
            "$app/Contents/MacOS/decode_morse" --wav "$RUNNER_TEMP/test.wav" | tee decoded.txt
          grep -q "CQ CQ DE JA1ABC JA1ABC K" decoded.txt

      # 画面のアプリが macOS で**起動して組み方を数えられるか**。CI の
      # macOS は画面を持ちますが、画面の試験は初めてなので、落ちても
      # 配布物は残します（結果は記録で読む）。
      # Whether the GUI **starts on macOS and can count its layout.** The
      # runner has a display, but this is the first GUI run there, so a
      # failure does not cost the package (the result is read from the log).
      - name: 画面の組み方の検査（macOS、参考）
        continue-on-error: true
        working-directory: lazarus
        run: |
          app="$PWD/dist/deepcw-station-macos-arm64/DeepCW Station.app"
          mkdir -p "$RUNNER_TEMP/cfg"
          DEEPCW_CONFIG_DIR="$RUNNER_TEMP/cfg" DEEPCW_LAYOUT_CHECK=1 \
            perl -e 'alarm 180; exec @ARGV' "$app/Contents/MacOS/deepcw_station" --lang ja

      # **dmg にします。**成果物は zip にされ、**実行の印（x）が落ちます**
      # ——`.app` をそのまま渡すと起動しません。dmg は印を保ちます。
      # **Packed as a dmg.** Artifacts are zipped and **lose the executable
      # bit**, so a bare `.app` would not start; a dmg keeps it.
      - name: dmg にする
        working-directory: lazarus
        run: |
          set -eo pipefail
          hdiutil create -volname "DeepCW Station" \
            -srcfolder dist/deepcw-station-macos-arm64 -ov -format UDZO \
            dist/deepcw-station-macos-arm64.dmg
          ls -l dist/deepcw-station-macos-arm64.dmg

      - name: macOS の配布物を残す
        uses: actions/upload-artifact@v4
        with:
          name: deepcw-station-macos-arm64
          path: lazarus/dist/deepcw-station-macos-arm64.dmg
          if-no-files-found: error
          retention-days: 30
